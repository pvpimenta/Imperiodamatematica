<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - Império Matemático</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap');
        body { margin: 0; padding: 20px; font-family: 'Poppins', sans-serif; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; }
        h1 { font-family: 'Fredoka One', cursive; color: #FFD700; text-align: center; font-size: 36px;}
        .container { background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 15px; width: 90%; max-width: 800px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        input { width: 100%; padding: 10px; margin: 5px 0 15px; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: 'Fredoka One'; color: white; transition: 0.2s;}
        .btn-lancar { background: #4CAF50; width: 100%; font-size: 20px; margin-top: 10px;}
        .btn-lancar:hover { background: #45a049; }
        .btn-perigo { background: #ff4757; }
        .btn-perigo:hover { background: #ff6b81; }
        
        /* Lista de alunos */
        .aluno-item { background: rgba(0,0,0,0.5); padding: 10px 15px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .dinheiro { color: #4CAF50; font-family: 'Fredoka One'; font-size: 18px; }
        
        #areaAdmin { display: none; width: 100%; display: flex; flex-direction: column; align-items: center;}
        #loginBox { text-align: center; width: 100%; max-width: 400px; margin-top: 100px; }
        .btn-login { background: #3498db; width: 100%; }

        .grid-painel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1000px; }
        @media(max-width: 768px) { .grid-painel { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- TELA DE SENHA -->
    <div class="container" id="loginBox">
        <h1>👨‍🏫 Acesso do Professor</h1>
        <p>Digite a senha para acessar o controle do jogo.</p>
        <input type="password" id="senhaProf" placeholder="Senha">
        <button class="btn-login" id="btnEntrar">ACESSAR PAINEL</button>
    </div>

    <!-- PAINEL DE CONTROLE -->
    <div id="areaAdmin" style="display: none;">
        <h1>👑 Controle do Império</h1>
        
        <div class="grid-painel">
            <!-- COLUNA 1: Lançar Desafios -->
            <div class="container">
                <h2 style="color: #4CAF50; font-family: 'Fredoka One'; margin-top:0;">⚡ Lançar Novo Desafio</h2>
                <label>Pergunta (Ex: Quanto é 8 x 7?)</label>
                <input type="text" id="novaPergunta" placeholder="Digite a conta ou problema">
                
                <label>Resposta Correta (Ex: 56)</label>
                <input type="number" id="novaResposta" placeholder="Apenas números">
                
                <label>Recompensa ($)</label>
                <input type="number" id="novaRecompensa" placeholder="Ex: 500" value="500">
                
                <button class="btn-lancar" id="btnLancar">ENVIAR PARA OS ALUNOS!</button>
                <p id="statusRodada" style="text-align: center; color: #FFD700; font-weight: bold; margin-top: 15px;"></p>
            </div>

            <!-- COLUNA 2: Gestão da Sala -->
            <div class="container">
                <h2 style="color: #3498db; font-family: 'Fredoka One'; margin-top:0;">👥 Sala de Aula</h2>
                <button class="btn-perigo" id="btnZerarSala" style="width: 100%; margin-bottom: 15px;">Zerar Sala (Apagar Todos)</button>
                <div id="listaAlunosAdmin">
                    <!-- Alunos aparecem aqui -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // MESMA CHAVE DO INDEX.HTML
        const firebaseConfig = {
            apiKey: "AIzaSyAlwxaIIxETYSBGTtH1q6HMvXA62Cx9OLg",
            authDomain: "imperiomatematico-8b227.firebaseapp.com",
            databaseURL: "https://imperiomatematico-8b227-default-rtdb.firebaseio.com", 
            projectId: "imperiomatematico-8b227",
            storageBucket: "imperiomatematico-8b227.firebasestorage.app",
            messagingSenderId: "806261301043",
            appId: "1:806261301043:web:8d94c950247581f99de846"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // LOGIN SIMPLES (Senha padrão: prof123)
        document.getElementById('btnEntrar').addEventListener('click', () => {
            const senha = document.getElementById('senhaProf').value;
            if(senha === "prof123") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('areaAdmin').style.display = 'flex';
            } else {
                alert("Senha incorreta!");
            }
        });

        // LANÇAR RODADA
        document.getElementById('btnLancar').addEventListener('click', () => {
            const pergunta = document.getElementById('novaPergunta').value;
            const resposta = document.getElementById('novaResposta').value;
            const recompensa = parseInt(document.getElementById('novaRecompensa').value);

            if(pergunta && resposta && recompensa) {
                set(ref(db, 'rodadaAtual'), {
                    pergunta: pergunta,
                    resposta: resposta,
                    recompensa: recompensa,
                    ativa: true,
                    vencedor: ""
                });
                document.getElementById('statusRodada').innerText = "Desafio na tela dos alunos! Aguardando resposta...";
            } else {
                alert("Preencha todos os campos do desafio.");
            }
        });

        // MONITORAR QUEM VENCEU
        onValue(ref(db, 'rodadaAtual'), (snapshot) => {
            const rodada = snapshot.val();
            if(rodada && rodada.vencedor !== "") {
                document.getElementById('statusRodada').innerHTML = `O aluno <b style='color:#4CAF50'>${rodada.vencedor}</b> foi o mais rápido!`;
            }
        });

        // MONITORAR ALUNOS E BOTÃO DE EXPULSAR
        onValue(ref(db, 'jogadores'), (snapshot) => {
            const lista = document.getElementById('listaAlunosAdmin');
            lista.innerHTML = '';
            const dados = snapshot.val();
            
            if (dados) {
                Object.entries(dados).forEach(([id, j]) => {
                    lista.innerHTML += `
                    <div class="aluno-item">
                        <div><b>${j.nome}</b> (${j.turma}) <br> <span class="dinheiro">$ ${j.dinheiro}</span></div>
                        <button class="btn-perigo" style="padding: 5px 10px; font-size: 12px;" onclick="expulsarAluno('${id}')">X</button>
                    </div>`;
                });
            } else {
                lista.innerHTML = '<p>Nenhum aluno na sala.</p>';
            }
        });

        // FUNÇÃO DE EXPULSAR (Fica na janela para o HTML enxergar)
        window.expulsarAluno = function(id) {
            if(confirm("Tem certeza que deseja remover este aluno?")) {
                remove(ref(db, 'jogadores/' + id));
            }
        }

        // ZERAR A SALA
        document.getElementById('btnZerarSala').addEventListener('click', () => {
            if(confirm("ATENÇÃO: Isso vai apagar todos os alunos e reiniciar o jogo. Tem certeza?")) {
                remove(ref(db, 'jogadores'));
                remove(ref(db, 'rodadaAtual'));
                document.getElementById('statusRodada').innerText = "Sala zerada. Pronta para a próxima turma!";
            }
        });
    </script>
</body>
</html>
