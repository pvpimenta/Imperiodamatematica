<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Matemático</title>
    <style>
        /* Estilo Gamificado e Engajador */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            width: 300px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 32px;
            margin-bottom: 5px;
            color: #FFD700;
            text-shadow: 2px 2px 0px #FF8C00, 4px 4px 0px #000;
        }

        p {
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
        }

        input:focus {
            outline: 2px solid #FFD700;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #FF416C, #FF4B2B);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: 'Fredoka One', cursive;
            margin-top: 15px;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 5px rgba(255, 75, 43, 0.4);
        }

        button:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>🎲 Império<br>Matemático</h1>
        <p>Prepare-se para calcular e conquistar!</p>
        
        <input type="text" id="nomeAluno" placeholder="Seu Nome ou Apelido" required>
        <input type="text" id="turmaAluno" placeholder="Sua Turma (ex: 7A)" required>
        
        <button onclick="entrarNoJogo()">ENTRAR NO JOGO!</button>
    </div>

    <!-- Aqui entrará o Firebase na próxima etapa -->
    <script>
        function entrarNoJogo() {
            const nome = document.getElementById('nomeAluno').value;
            const turma = document.getElementById('turmaAluno').value;

            if(nome && turma) {
                // Efeito sonoro e animação entrariam aqui
                alert(`Bem-vindo, ${nome} da turma ${turma}! Conectando ao servidor...`);
                // Na próxima etapa, esse botão vai mandar os dados pro Firebase!
            } else {
                alert("Preencha seu nome e turma para jogar!");
            }
        }
    </script>

</body>
</html>
