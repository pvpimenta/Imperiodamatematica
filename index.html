<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Matemático</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            width: 350px;
            transition: all 0.5s ease;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 32px;
            margin-bottom: 5px;
            color: #FFD700;
            text-shadow: 2px 2px 0px #FF8C00, 4px 4px 0px #000;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #FF416C, #FF4B2B);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            font-family: 'Fredoka One', cursive;
            margin-top: 15px;
        }

        button:hover { filter: brightness(1.1); }

        /* Estilos do Ranking */
        #rankingBox {
            display: none; /* Escondido até o login */
            width: 400px;
        }

        .ranking-list {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .jogador-item {
            background: rgba(0, 0, 0, 0.3);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            border-left: 5px solid #FFD700;
            animation: slideIn 0.3s ease-out;
        }

        .jogador-info { text-align: left; }
        .jogador-nome { font-size: 18px; color: #FFD700; }
        .jogador-turma { font-size: 12px; color: #ccc; }
        .jogador-dinheiro { font-size: 20px; font-family: 'Fredoka One', cursive; color: #4CAF50; }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div class="container" id="loginBox">
        <h1>🎲 Império<br>Matemático</h1>
        <p>Prepare-se para calcular e conquistar!</p>
        <input type="text" id="nomeAluno" placeholder="Seu Nome" required>
        <input type="text" id="turmaAluno" placeholder="Sua Turma (ex: 7A)" required>
        <button id="btnEntrar">ENTRAR NO JOGO!</button>
    </div>

    <!-- TELA DE RANKING (SALA DE ESPERA) -->
    <div class="container" id="rankingBox">
        <h1>🏆 Sala de Espera</h1>
        <p>Aguardando os jogadores...</p>
        <ul class="ranking-list" id="listaJogadores">
            <!-- Os jogadores vão aparecer aqui dinamicamente -->
        </ul>
        <button style="background: linear-gradient(45deg, #00b09b, #96c93d);">INICIAR PARTIDA</button>
    </div>

    <!-- SCRIPT DO FIREBASE (Usando módulos do navegador) -->
    <script type="module">
        // 1. Importando as funções do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // 2. Sua Configuração (Adicionei a databaseURL que é exigida no Realtime DB)
        const firebaseConfig = {
            apiKey: "AIzaSyAlwxaIIxETYSBGTtH1q6HMvXA62Cx9OLg",
            authDomain: "imperiomatematico-8b227.firebaseapp.com",
            databaseURL: "https://imperiomatematico-8b227-default-rtdb.firebaseio.com", 
            projectId: "imperiomatematico-8b227",
            storageBucket: "imperiomatematico-8b227.firebasestorage.app",
            messagingSenderId: "806261301043",
            appId: "1:806261301043:web:8d94c950247581f99de846"
        };

        // 3. Inicializando
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const jogadoresRef = ref(db, 'jogadores');

        // 4. Lógica de entrar no jogo
        document.getElementById('btnEntrar').addEventListener('click', () => {
            const nome = document.getElementById('nomeAluno').value.trim();
            const turma = document.getElementById('turmaAluno').value.trim();

            if(nome && turma) {
                // Salva o aluno no banco de dados com $ 1500 iniciais
                push(jogadoresRef, {
                    nome: nome,
                    turma: turma,
                    dinheiro: 1500,
                    patrimonio: 1500,
                    posicaoTabuleiro: 0
                });

                // Esconde login e mostra ranking
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('rankingBox').style.display = 'block';
            } else {
                alert("Preencha nome e turma!");
            }
        });

        // 5. Escutando o banco em tempo real para atualizar o ranking
        onValue(jogadoresRef, (snapshot) => {
            const lista = document.getElementById('listaJogadores');
            lista.innerHTML = ''; // Limpa a lista antes de atualizar

            const dados = snapshot.val();
            if (dados) {
                // Converte objeto em array para poder ordenar por dinheiro
                const arrayJogadores = Object.values(dados);
                arrayJogadores.sort((a, b) => b.dinheiro - a.dinheiro);

                // Cria o visual de cada jogador na tela
                arrayJogadores.forEach(jogador => {
                    lista.innerHTML += `
                        <li class="jogador-item">
                            <div class="jogador-info">
                                <div class="jogador-nome">${jogador.nome}</div>
                                <div class="jogador-turma">Turma: ${jogador.turma}</div>
                            </div>
                            <div class="jogador-dinheiro">$ ${jogador.dinheiro}</div>
                        </li>
                    `;
                });
            }
        });
    </script>
</body>
</html>
