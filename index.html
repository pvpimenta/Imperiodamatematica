<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Matemático - O Tabuleiro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap');
        body { margin: 0; padding: 20px; font-family: 'Poppins', sans-serif; background: #1e3c72; color: #fff; display: flex; flex-direction: column; align-items: center; }
        h1 { font-family: 'Fredoka One', cursive; font-size: 32px; color: #FFD700; text-shadow: 2px 2px 0px #FF8C00; margin: 10px 0; text-align: center;}
        
        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; text-align: center; width: 100%; max-width: 400px; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(45deg, #FF416C, #FF4B2B); color: white; font-size: 18px; font-weight: bold; cursor: pointer; font-family: 'Fredoka One'; margin-top: 10px; }
        
        /* O TABULEIRO (A Trilha) */
        #areaJogo { display: none; width: 100%; max-width: 800px; }
        .trilha { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .casa { background: white; color: #333; width: 80px; height: 80px; border-radius: 10px; border: 3px solid #333; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; font-size: 12px; font-weight: bold; padding: 5px; position: relative; }
        .casa-inicio { background: #FFD700; }
        
        /* Os Jogadores no Tabuleiro */
        .peao { background: #4CAF50; color: white; padding: 2px 5px; border-radius: 5px; font-size: 10px; margin-top: 2px; width: 90%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        /* O Dado */
        .area-dado { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        #resultadoDado { font-size: 40px; font-family: 'Fredoka One'; margin: 10px 0; color: #FFD700; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div class="container" id="loginBox">
        <h1>🎲 Império Matemático</h1>
        <p>Bem-vindo ao Tabuleiro!</p>
        <input type="text" id="nomeAluno" placeholder="Seu Nome" required>
        <button id="btnEntrar">ENTRAR NO JOGO</button>
    </div>

    <!-- TELA DO TABULEIRO -->
    <div id="areaJogo">
        <div class="area-dado">
            <div style="font-size: 18px;">Seu Dinheiro: <b id="meuDinheiroTexto" style="color:#4CAF50;">$1500</b></div>
            <div id="resultadoDado">🎲</div>
            <button id="btnRolarDado">JOGAR O DADO</button>
        </div>

        <h2 style="text-align: center; font-family: 'Fredoka One';">A Trilha</h2>
        <div class="trilha" id="tabuleiroHTML">
            <!-- As casas serão geradas pelo JavaScript -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlwxaIIxETYSBGTtH1q6HMvXA62Cx9OLg",
            authDomain: "imperiomatematico-8b227.firebaseapp.com",
            databaseURL: "https://imperiomatematico-8b227-default-rtdb.firebaseio.com", 
            projectId: "imperiomatematico-8b227"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let meuId = null;
        let meuNome = "";
        let minhaPosicao = 0;
        const totalCasas = 16; // Um tabuleiro circular simples com 16 casas

        // GERAR O TABULEIRO VISUAL
        const tabuleiroHTML = document.getElementById('tabuleiroHTML');
        for(let i = 0; i < totalCasas; i++) {
            let nomeCasa = i === 0 ? "INÍCIO" : `Propriedade ${i}`;
            let classeExtra = i === 0 ? "casa-inicio" : "";
            tabuleiroHTML.innerHTML += `<div class="casa ${classeExtra}" id="casa-${i}">${nomeCasa}</div>`;
        }

        // LOGIN
        document.getElementById('btnEntrar').addEventListener('click', () => {
            meuNome = document.getElementById('nomeAluno').value.trim();
            if(meuNome) {
                const novoJogador = push(ref(db, 'jogadores'));
                meuId = novoJogador.key;
                
                // Agora o jogador tem POSIÇÃO
                set(novoJogador, { nome: meuNome, dinheiro: 1500, posicao: 0 });

                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('areaJogo').style.display = 'block';
            }
        });

        // ROLAR O DADO
        document.getElementById('btnRolarDado').addEventListener('click', () => {
            // Sorteia um número de 1 a 6
            const dado = Math.floor(Math.random() * 6) + 1;
            document.getElementById('resultadoDado').innerText = `🎲 ${dado}`;
            
            // Calcula a nova posição (dá a volta no tabuleiro se passar da última casa)
            minhaPosicao = (minhaPosicao + dado) % totalCasas;
            
            // Atualiza no banco de dados para todo mundo ver
            update(ref(db, 'jogadores/' + meuId), { posicao: minhaPosicao });
        });

        // DESENHAR OS JOGADORES NO TABULEIRO EM TEMPO REAL
        onValue(ref(db, 'jogadores'), (snapshot) => {
            // 1. Limpa todos os peões do tabuleiro primeiro
            for(let i = 0; i < totalCasas; i++) {
                const casaDiv = document.getElementById(`casa-${i}`);
                // Mantém apenas o texto original da casa (removendo as divs de peão)
                const textoCasa = i === 0 ? "INÍCIO" : `Propriedade ${i}`;
                casaDiv.innerHTML = textoCasa; 
            }

            const dados = snapshot.val();
            if (dados) {
                Object.entries(dados).forEach(([id, j]) => {
                    // Atualiza meu próprio dinheiro na tela
                    if(id === meuId) {
                        document.getElementById('meuDinheiroTexto').innerText = `$${j.dinheiro}`;
                    }

                    // Coloca o "peão" (nome do jogador) na casa correspondente
                    const casaAtual = document.getElementById(`casa-${j.posicao}`);
                    if(casaAtual) {
                        casaAtual.innerHTML += `<div class="peao">${j.nome}</div>`;
                    }
                });
            }
        });
    </script>
</body>
</html>
